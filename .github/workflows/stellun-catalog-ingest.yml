# STELLUN CelesTrak ingest.
# GitHub fetches each CelesTrak group and posts it to /api/public/ingest, which stores it in Supabase.
# The site only reads from Supabase, so the Worker no longer waits on CelesTrak.
# Secrets: STELLUN_CRON_SECRET, STELLUN_SITE_URL (= https://stellun.space)

name: Stellun CelesTrak ingest

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Pick one group to test, or all"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "galileo"
          - "glo-ops"
          - "beidou"
          - "visual"
          - "19820"
          - "stations"
          - "iridium-NEXT"
          - "weather"
          - "science"
          - "resource"
          - "gps-ops"
          - "starlink"
          - "active"
          - "geo"
          - "cosmos-2251-debris"
          - "iridium-33-debris"

permissions:
  contents: read

concurrency:
  group: stellun-celestrak-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch CelesTrak groups and send to STELLUN
        env:
          SECRET: ${{ secrets.STELLUN_CRON_SECRET }}
          BASE: ${{ secrets.STELLUN_SITE_URL }}
          ONLY: ${{ github.event.inputs.group }}
        run: |
          set -uo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "Missing STELLUN_CRON_SECRET"
            exit 1
          fi
          BASE="${BASE:-https://stellun.space}"
          BASE="${BASE%/}"

          ALL="stations iridium-NEXT weather science resource gps-ops galileo glo-ops beidou visual 19820 starlink active geo cosmos-2251-debris iridium-33-debris"
          REQ="${ONLY:-all}"
          if [ -z "$REQ" ] || [ "$REQ" = "all" ]; then
            GROUPS="$ALL"
          else
            GROUPS="$REQ"
          fi

          # Reject unknown names before contacting CelesTrak.
          for G in $GROUPS; do
            case " $ALL " in
              *" $G "*) ;;
              *) echo "Unknown group '$G'. Allowed: $ALL"; exit 1 ;;
            esac
          done
          echo "Groups this run: $GROUPS"

          cat > /tmp/wrap.py <<'PY'
          import json, sys
          group = sys.argv[1]
          raw = open("/tmp/ct.json", "rb").read()
          try:
              data = json.loads(raw)
          except Exception as e:
              print(f"{group}: CelesTrak did not return JSON ({e}). Start of response: {raw[:160]!r}")
              sys.exit(2)
          if not isinstance(data, list) or not data:
              print(f"{group}: CelesTrak returned an empty or non-list response. Start: {raw[:160]!r}")
              sys.exit(2)
          with open("/tmp/body.json", "w") as f:
              json.dump({"group": group, "payload": data}, f)
          print(f"{group}: {len(data)} records from CelesTrak")
          PY

          FAILED=""
          for G in $GROUPS; do
            OK=0
            for TRY in 1 2 3; do
              CODE=$(curl -sS -o /tmp/ct.json -w "%{http_code}" --max-time 150 \
                "https://celestrak.org/NORAD/elements/gp.php?GROUP=${G}&FORMAT=json" || echo "000")
              if [ "$CODE" = "200" ] && python3 /tmp/wrap.py "$G"; then
                RESP=$(curl -sS --max-time 180 -X POST \
                  -H "Authorization: Bearer ${SECRET}" \
                  -H "Content-Type: application/json" \
                  --data-binary @/tmp/body.json \
                  "${BASE}/api/public/ingest" || echo '{"ok":false,"error":"request failed"}')
                echo "$G -> $RESP"
                if echo "$RESP" | grep -q '"ok":true'; then OK=1; break; fi
              else
                echo "$G: no usable data this attempt (CelesTrak HTTP $CODE, attempt $TRY)"
              fi
              sleep 30
            done
            if [ "$OK" != "1" ]; then FAILED="$FAILED $G"; fi
            sleep 5
          done

          if [ -n "$FAILED" ]; then
            echo "Failed groups:$FAILED"
            exit 1
          fi
          echo "All groups ingested"
