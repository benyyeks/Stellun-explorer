# STELLUN CelesTrak and Mars ingest.
# GitHub fetches the CelesTrak groups and the Mars Perseverance feed, then posts them to /api/public/ingest,
# which stores them in Supabase. The site only reads from Supabase.
# Scheduled: every 2 hours, everything. Manual: pick one item from the dropdown, or all.
# Secrets: STELLUN_CRON_SECRET, STELLUN_SITE_URL (= https://stellun.space)

name: Stellun CelesTrak ingest

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Pick one CelesTrak group or mars, or all"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "mars"
          - "galileo"
          - "glo-ops"
          - "beidou"
          - "visual"
          - "19820"
          - "stations"
          - "iridium-NEXT"
          - "weather"
          - "science"
          - "resource"
          - "gps-ops"
          - "starlink"
          - "active"
          - "geo"
          - "cosmos-2251-debris"
          - "iridium-33-debris"

permissions:
  contents: read

concurrency:
  group: stellun-celestrak-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Fetch CelesTrak groups and Mars, send to STELLUN
        env:
          SECRET: ${{ secrets.STELLUN_CRON_SECRET }}
          BASE: ${{ secrets.STELLUN_SITE_URL }}
          ONLY: ${{ github.event.inputs.group }}
        run: |
          set -uo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "Missing STELLUN_CRON_SECRET"
            exit 1
          fi
          BASE="${BASE:-https://stellun.space}"
          BASE="${BASE%/}"

          ALL="stations iridium-NEXT weather science resource gps-ops galileo glo-ops beidou visual 19820 starlink active geo cosmos-2251-debris iridium-33-debris"
          REQ="${ONLY:-all}"
          if [ -z "$REQ" ] || [ "$REQ" = "all" ]; then
            CT_GROUPS="$ALL"
            DO_MARS=1
          elif [ "$REQ" = "mars" ]; then
            CT_GROUPS=""
            DO_MARS=1
          else
            CT_GROUPS="$REQ"
            DO_MARS=0
          fi
          for G in $CT_GROUPS; do
            case " $ALL " in
              *" $G "*) ;;
              *) echo "Unknown group '$G'. Allowed: $ALL mars"; exit 1 ;;
            esac
          done
          echo "CelesTrak groups this run: ${CT_GROUPS:-none} | Mars: $DO_MARS"

          cat > /tmp/wrap.py <<'PY'
          import json, sys
          group = sys.argv[1]
          raw = open("/tmp/ct.json", "rb").read()
          try:
              data = json.loads(raw)
          except Exception as e:
              print(f"{group}: CelesTrak did not return JSON ({e}). Start of response: {raw[:160]!r}")
              sys.exit(2)
          if not isinstance(data, list) or not data:
              print(f"{group}: CelesTrak returned an empty or non-list response. Start: {raw[:160]!r}")
              sys.exit(2)
          with open("/tmp/body.json", "w") as f:
              json.dump({"group": group, "payload": data}, f)
          print(f"{group}: {len(data)} records from CelesTrak")
          PY

          cat > /tmp/wrap_mars.py <<'PY'
          import json
          raw = open("/tmp/mars.json", "rb").read()
          try:
              data = json.loads(raw)
          except Exception as e:
              print(f"mars: NASA did not return JSON ({e}). Start of response: {raw[:160]!r}")
              raise SystemExit(2)
          images = data.get("images") if isinstance(data, dict) else None
          if not isinstance(images, list) or not images:
              print(f"mars: NASA returned no images. Start: {raw[:160]!r}")
              raise SystemExit(2)
          with open("/tmp/mars_body.json", "w") as f:
              json.dump({"kind": "mars-perseverance-latest", "payload": data}, f)
          print(f"mars: {len(images)} frames from NASA")
          PY

          FAILED=""
          for G in $CT_GROUPS; do
            case "$G" in
              ''|*[!0-9]*) URL="https://celestrak.org/NORAD/elements/gp.php?GROUP=${G}&FORMAT=json" ;;
              *)           URL="https://celestrak.org/NORAD/elements/gp.php?CATNR=${G}&FORMAT=json" ;;
            esac
            FETCH_OK=0
            for TRY in 1 2; do
              CODE=$(curl -sS -o /tmp/ct.json -w "%{http_code}" --max-time 180 "$URL" || echo "000")
              if [ "$CODE" = "200" ] && python3 /tmp/wrap.py "$G"; then
                FETCH_OK=1
                break
              fi
              echo "$G: no usable data from CelesTrak (HTTP $CODE, attempt $TRY). Waiting 60 s before any retry."
              sleep 60
            done
            OK=0
            if [ "$FETCH_OK" = "1" ]; then
              for POST_TRY in 1 2 3; do
                RESP=$(curl -sS --max-time 180 -X POST \
                  -H "Authorization: Bearer ${SECRET}" \
                  -H "Content-Type: application/json" \
                  --data-binary @/tmp/body.json \
                  "${BASE}/api/public/ingest" || echo '{"ok":false,"error":"request failed"}')
                echo "$G -> $RESP"
                if echo "$RESP" | grep -q '"ok":true'; then OK=1; break; fi
                echo "$G: store failed (attempt $POST_TRY). Retrying the store only, not CelesTrak."
                sleep 30
              done
            fi
            if [ "$OK" != "1" ]; then FAILED="$FAILED $G"; fi
            sleep 10
          done

          if [ "$DO_MARS" = "1" ]; then
            OKM=0
            for TRY in 1 2; do
              CODE=$(curl -sS -o /tmp/mars.json -w "%{http_code}" --max-time 120 \
                "https://mars.nasa.gov/rss/api/?feed=raw_images&category=mars2020&feedtype=json&num=48&page=0&format=json&order=sol+desc" || echo "000")
              if [ "$CODE" = "200" ] && python3 /tmp/wrap_mars.py; then
                RESP=$(curl -sS --max-time 180 -X POST \
                  -H "Authorization: Bearer ${SECRET}" \
                  -H "Content-Type: application/json" \
                  --data-binary @/tmp/mars_body.json \
                  "${BASE}/api/public/ingest" || echo '{"ok":false,"error":"request failed"}')
                echo "mars -> $RESP"
                if echo "$RESP" | grep -q '"ok":true'; then OKM=1; break; fi
              else
                echo "mars: no usable data this attempt (NASA HTTP $CODE, attempt $TRY)"
              fi
              sleep 20
            done
            if [ "$OKM" != "1" ]; then FAILED="$FAILED mars"; fi
          fi

          if [ -n "$FAILED" ]; then
            echo "Failed:$FAILED"
            exit 1
          fi
          echo "All ingested"
