# STELLUN staggered feed refresh
# Secrets: STELLUN_CRON_SECRET (= Cloudflare LOVABLE_CRON_SECRET)
#          STELLUN_SITE_URL = https://stellun.space

name: Stellun feed refresh

on:
  schedule:
    # Every 10 minutes: rotate one "slot" (see step below)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot name (iss | space-weather | stations | starlink | ...)"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refresh one slot
        env:
          SECRET: ${{ secrets.STELLUN_CRON_SECRET }}
          BASE: ${{ secrets.STELLUN_SITE_URL }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "Missing STELLUN_CRON_SECRET"
            exit 1
          fi
          BASE="${BASE:-https://stellun.space}"
          BASE="${BASE%/}"

          # 10-minute slots across the day (UTC minute/10 + hour)
          # 0 iss+kp  1 solar+xray  2 stations  3 launches
          # 4 starlink  5 active  6 geo  7 weather
          # 8 science  9 resource  10 gps  11 news+apod
          if [ -n "${MANUAL_SLOT:-}" ]; then
            SLOT="$MANUAL_SLOT"
          else
            H=$(date -u +%H)
            M=$(date -u +%M)
            IDX=$(( (10#$H * 6 + 10#$M / 10) % 12 ))
            case "$IDX" in
              0) SLOT=iss ;;
              1) SLOT=space-weather ;;
              2) SLOT=stations ;;
              3) SLOT=launches ;;
              4) SLOT=starlink ;;
              5) SLOT=active ;;
              6) SLOT=geo ;;
              7) SLOT=weather ;;
              8) SLOT=science ;;
              9) SLOT=resource ;;
              10) SLOT=gps ;;
              *) SLOT=news ;;
            esac
          fi

          echo "Slot=$SLOT Base=$BASE"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            "\( {BASE}/api/public/refresh?slot= \){SLOT}"
          echo
          echo OK
