# STELLUN staggered feeds.
# Scheduled: one slot per run from a 14-slot rotation keyed on the clock (every 15 minutes),
# so each slot comes round every 3.5 hours.
# Manual: pick a slot from the dropdown, or auto for the normal rotation.
# CelesTrak groups and Mars are fetched by "Stellun CelesTrak ingest" (every 2 hours); the ISS has its own workflow.
# Secrets: STELLUN_CRON_SECRET, STELLUN_SITE_URL (= https://stellun.space)

name: Stellun feed refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run, or auto for the normal rotation"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "stations"
          - "starlink"
          - "space-weather"
          - "iridium"
          - "resource"
          - "geo"
          - "weather"
          - "science"
          - "gps"
          - "launches"
          - "news"
          - "mars"
          - "sso"
          - "asteroids"

permissions:
  contents: read

concurrency:
  group: stellun-feed-cron
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Refresh one slot
        env:
          SECRET: ${{ secrets.STELLUN_CRON_SECRET }}
          BASE: ${{ secrets.STELLUN_SITE_URL }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "Missing STELLUN_CRON_SECRET"
            exit 1
          fi
          BASE="${BASE:-https://stellun.space}"
          BASE="${BASE%/}"

          SLOTS=(stations starlink space-weather iridium resource geo weather science gps launches news mars sso asteroids)
          if [ -n "${MANUAL_SLOT:-}" ] && [ "$MANUAL_SLOT" != "auto" ]; then
            SLOT="$MANUAL_SLOT"
          else
            Q=$(( $(date -u +%s) / 900 ))
            SLOT="${SLOTS[$(( Q % ${#SLOTS[@]} ))]}"
          fi

          echo "Slot=$SLOT Base=$BASE at $(date -u +%H:%M:%S) UTC"
          BODY=$(curl -fsS --max-time 240 -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE}/api/public/refresh?slot=${SLOT}")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true\|"ok": true' || exit 1
          echo OK
