# STELLUN staggered feeds — one slot per run (no Refresh-all, no ISS)
# ISS has its own workflow: stellun-iss-refresh.yml
# Launches seed: stellun-ll2-seed.yml
#
# Secrets: STELLUN_CRON_SECRET, STELLUN_SITE_URL (= https://stellun.space)

name: Stellun feed refresh

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "stations | starlink | space-weather | iridium | resource | geo | weather | science | gps | launches | news | mars"
        required: false
        default: ""

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh one slot
        env:
          SECRET: ${{ secrets.STELLUN_CRON_SECRET }}
          BASE: ${{ secrets.STELLUN_SITE_URL }}
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "Missing STELLUN_CRON_SECRET"
            exit 1
          fi
          BASE="${BASE:-https://stellun.space}"
          BASE="${BASE%/}"

          if [ -n "${MANUAL_SLOT:-}" ]; then
            SLOT="$MANUAL_SLOT"
          else
            H=$(date -u +%H)
            M=$(date -u +%M)
            IDX=$(( (10#$H * 4 + 10#$M / 15) % 12 ))
            case "$IDX" in
              0) SLOT=stations ;;
              1) SLOT=starlink ;;
              2) SLOT=space-weather ;;
              3) SLOT=iridium ;;
              4) SLOT=resource ;;
              5) SLOT=geo ;;
              6) SLOT=weather ;;
              7) SLOT=science ;;
              8) SLOT=gps ;;
              9) SLOT=launches ;;
              10) SLOT=news ;;
              *) SLOT=mars ;;
            esac
          fi

          echo "Slot=$SLOT Base=$BASE"
          BODY=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            "\( {BASE}/api/public/refresh?slot= \){SLOT}")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true\|"ok": true' || exit 1
          echo OK
