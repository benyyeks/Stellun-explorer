# STELLUN — ISS only. Fails if Worker does not report ok / fresh|cache write path.
name: Stellun ISS refresh

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  iss:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh ISS and verify JSON
        env:
          SECRET: ${{ secrets.STELLUN_CRON_SECRET }}
          BASE: ${{ secrets.STELLUN_SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SECRET:-}" ]; then
            echo "Missing STELLUN_CRON_SECRET"
            exit 1
          fi
          BASE="${BASE:-https://stellun.space}"
          BASE="${BASE%/}"
          echo "ISS force refresh → ${BASE}"
          BODY=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE}/api/public/refresh?only=iss-position&force=1")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true\|"ok": true' || {
            echo "Worker did not return ok:true"
            exit 1
          }
          echo "$BODY" | grep -q '"failed":0\|"failed": 0' || {
            echo "Worker reported failed feeds"
            exit 1
          }
          echo OK
